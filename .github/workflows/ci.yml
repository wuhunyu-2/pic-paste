name: Native macOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  native:
    runs-on: xcode-27
    env:
      # PR checkouts use an ephemeral merge SHA; record both source and tested revisions.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify P0 evidence collector (synthetic fixtures only)
        run: bash scripts/tests/test_collect_p0_evidence.sh
      - name: Toolchain and source revision
        run: |
          xcodebuild -version
          sw_vers
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "CHECKOUT_SHA=$(git rev-parse HEAD)"
          uname -m
          system_profiler SPDisplaysDataType | head -n 60
      - name: Probe AppKit desktop session (informational, non-gating)
        continue-on-error: true
        run: xcrun swift scripts/tests/macos_desktop_session_probe.swift
      - name: Probe one-shot ScreenCaptureKit (informational, no pixels saved)
        continue-on-error: true
        timeout-minutes: 3
        run: xcrun swift scripts/tests/macos_capture_session_probe.swift
      - name: Verify real PicPaste CaptureService on hosted macOS
        timeout-minutes: 3
        run: |
          xcrun swiftc -o "$RUNNER_TEMP/picpaste-capture-service-probe" \
            scripts/tests/macos_capture_service_probe.swift \
            PicPaste/Capture/CapturedFrame.swift \
            PicPaste/Capture/ScreenPermissionService.swift \
            PicPaste/Capture/CaptureService.swift
          "$RUNNER_TEMP/picpaste-capture-service-probe"
      - name: Verify live PicPaste capture to selection PNG and pasteboard
        timeout-minutes: 3
        run: |
          xcrun swiftc -o "$RUNNER_TEMP/picpaste-live-e2e" \
            scripts/tests/macos_live_capture_selection_export.swift \
            PicPaste/Capture/CapturedFrame.swift \
            PicPaste/Capture/ScreenPermissionService.swift \
            PicPaste/Capture/CaptureService.swift \
            PicPaste/Capture/CaptureCoordinator.swift \
            PicPaste/Selection/SelectionGeometry.swift \
            PicPaste/Selection/SelectionInteraction.swift \
            PicPaste/Selection/SelectionView.swift \
            PicPaste/Selection/SelectionPanelController.swift \
            PicPaste/Export/ImageComposer.swift \
            PicPaste/Export/PNGExporter.swift \
            PicPaste/Export/ClipboardWriter.swift
          "$RUNNER_TEMP/picpaste-live-e2e"
      - name: Verify own-window exclusion, 30 captures, cancelled retries and memory bound
        timeout-minutes: 5
        run: |
          xcrun swiftc -o "$RUNNER_TEMP/picpaste-own-window-repeat" \
            scripts/tests/macos_capture_own_window_repeat.swift \
            PicPaste/Capture/CapturedFrame.swift \
            PicPaste/Capture/ScreenPermissionService.swift \
            PicPaste/Capture/CaptureService.swift \
            PicPaste/Capture/CaptureCoordinator.swift
          "$RUNNER_TEMP/picpaste-own-window-repeat"
      - name: Build and test
        run: |
          xcodebuild -project PicPaste.xcodeproj -scheme PicPaste -destination 'platform=macOS,arch=arm64' -resultBundlePath "$RUNNER_TEMP/PicPasteTests.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Print XCTest failure diagnostics
        if: failure()
        run: |
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/PicPasteTests.xcresult" --format json || true
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/PicPasteTests.xcresult" --format json || true
      - name: Upload XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PicPaste-XCTest-results
          path: ${{ runner.temp }}/PicPasteTests.xcresult
          if-no-files-found: warn
      - name: Build and verify ad-hoc signed development app
        run: |
          set -euo pipefail
          xcodebuild -project PicPaste.xcodeproj -scheme PicPaste -configuration Release -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/PicPasteDerived" CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/PicPasteDerived/Build/Products/Release/PicPaste.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/PicPaste"
          # CODE_SIGNING_ALLOWED=NO leaves an invalid/missing bundle resource seal.
          # Re-sign the completed .app with a local ad-hoc identity.
          # This is NOT a Developer ID signature and is NOT notarized.
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/PicPaste")" = arm64
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = com.wuhunyu.picpaste
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$APP/Contents/Info.plist")" = 27.0
          mkdir -p dist
          printf '%s\n' "$SOURCE_SHA" > dist/SOURCE_SHA.txt
          git rev-parse HEAD > dist/CHECKOUT_SHA.txt
          printf 'Ad-hoc signed developer preview; NOT Developer ID signed or Apple notarized.\n' > dist/SIGNING_MODE.txt
          ditto -c -k --keepParent "$APP" dist/PicPaste-macOS27-arm64-adhoc.zip
          (cd dist && shasum -a 256 PicPaste-macOS27-arm64-adhoc.zip | tee SHA256SUMS && shasum -a 256 -c SHA256SUMS)
          # Signing must survive ZIP distribution, not just work in DerivedData.
          EXTRACTED="$RUNNER_TEMP/picpaste-release-extracted"
          mkdir -p "$EXTRACTED"
          ditto -x -k dist/PicPaste-macOS27-arm64-adhoc.zip "$EXTRACTED"
          VERIFIED_APP="$EXTRACTED/PicPaste.app"
          test -x "$VERIFIED_APP/Contents/MacOS/PicPaste"
          codesign --verify --deep --strict --verbose=2 "$VERIFIED_APP"
          test "$(lipo -archs "$VERIFIED_APP/Contents/MacOS/PicPaste")" = arm64
          test "$(plutil -extract CFBundleIdentifier raw -o - "$VERIFIED_APP/Contents/Info.plist")" = com.wuhunyu.picpaste
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$VERIFIED_APP/Contents/Info.plist")" = 27.0
          echo 'CI_ADHOC_APP_ZIP_ROUNDTRIP=PASS'
          echo 'CI_RELEASE_BUNDLE_SIGNATURE=PASS'
          # Smoke-launch the executable from the *unpacked* downloadable ZIP.
          # This checks more than a file hash/signature but does not simulate
          # Gatekeeper quarantine or a real-user macOS desktop install.
          "$VERIFIED_APP/Contents/MacOS/PicPaste" > "$RUNNER_TEMP/picpaste-adhoc-launch.log" 2>&1 &
          APP_PID=$!
          sleep 3
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat "$RUNNER_TEMP/picpaste-adhoc-launch.log"
            wait "$APP_PID" || true
            echo 'CI_ADHOC_APP_LAUNCH=FAIL'
            exit 1
          fi
          kill "$APP_PID"
          wait "$APP_PID" || true
          echo 'CI_ADHOC_APP_LAUNCH=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: PicPaste-macOS27-arm64-adhoc
          path: dist/
          if-no-files-found: error
